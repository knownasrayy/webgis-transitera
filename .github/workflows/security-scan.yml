name: Security & Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Gitleaks Secret Scan (SEC-A4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-audit:
    name: Frontend Dependency & Lint Audit (SEC-L3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webdev/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: webdev/frontend
        run: npm ci

      - name: TypeScript Check
        working-directory: webdev/frontend
        run: npx tsc --noEmit
