version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: transitera_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: transitera_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: transitera_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/transitera_db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
